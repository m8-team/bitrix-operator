# Test-only storage: both isolated kind nodes mount the same temporary host directory.
# Production requires a shared CSI filesystem with cross-node flock semantics.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cron-test
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cron-test
spec:
  capacity:
    storage: 128Mi
  accessModes: [ReadWriteMany]
  storageClassName: cron-test
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: bitrix-web-test
    name: cron-uploads
  hostPath:
    path: /var/local/bitrix-cron-uploads
    type: Directory
