spec:
  runtime:
    web:
      replicas: 1
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
        targetCPUUtilization: 50
      nginx:
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
      php:
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
