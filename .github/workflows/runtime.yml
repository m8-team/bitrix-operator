name: Runtime contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: nginx, PHP and Push runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build controlled release fixture
        run: docker build -f test/fixtures/runtime/Dockerfile -t bitrix-runtime-fixture .
      - name: Validate native configs, settings, Secrets and Push protocol
        env:
          BITRIX_RUNTIME_CONTAINER_TESTS: "1"
        run: go test -count=1 -v ./internal/runtime
