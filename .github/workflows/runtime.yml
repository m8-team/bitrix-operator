name: Runtime contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: nginx, PHP and Push runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build controlled release fixture
        run: docker build -f test/fixtures/runtime/Dockerfile -t bitrix-runtime-fixture .
      - name: Validate native configs, settings, Secrets and Push protocol
        env:
          BITRIX_RUNTIME_CONTAINER_TESTS: "1"
        run: go test -count=1 -v ./internal/runtime
