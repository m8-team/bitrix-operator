name: Runtime contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: nginx and PHP runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Build controlled release fixture
        run: docker build -f test/fixtures/runtime/Dockerfile -t bitrix-runtime-fixture .
      - name: Validate syntax, extensions, settings preservation and Secret handling
        env:
          BITRIX_RUNTIME_CONTAINER_TESTS: "1"
        run: go test -count=1 -v ./internal/runtime
