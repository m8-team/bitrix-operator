name: Release images
on:
  # Weekly rebuild/scan of main catches advisories published after the last merge.
  schedule:
    - cron: '23 6 * * 1'
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s test/release -v
      - run: bash hack/release/lint-workflow.sh
      - name: Require a new version and successful main CI for this exact commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 hack/release/policy.py

  build:
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.0
      - name: Build the image once on its native architecture
        run: |
          mkdir -p out
          docker buildx build --platform "linux/$ARCH" --load --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "bitrix-operator:ci-$ARCH" .
          test "$(docker image inspect "bitrix-operator:ci-$ARCH" --format '{{.Architecture}}')" = "$ARCH"
          test "$(docker image inspect "bitrix-operator:ci-$ARCH" --format '{{.Config.User}}')" = '65532:65532'
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            "bitrix-operator:ci-$ARCH" --help
          docker save "bitrix-operator:ci-$ARCH" -o out/image.tar
          IMAGE_ID=$(docker image inspect "bitrix-operator:ci-$ARCH" --format '{{.Id}}')
          export IMAGE_ID
          python3 hack/release/provenance.py > out/provenance.json
      - name: Generate SPDX inventory and scan OS and Go packages
        run: |
          bash hack/release/install-tools.sh
          bin/trivy image --input out/image.tar --format spdx-json --output out/sbom.spdx.json
          scan_status=0
          bin/trivy image --input out/image.tar --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --format json --output out/vulnerabilities.json --ignorefile /dev/null || scan_status=$?
          if [[ -s out/vulnerabilities.json ]]; then
            jq -r '.Results[]?.Vulnerabilities[]? | [.VulnerabilityID, .Severity, .PkgName, .InstalledVersion, .FixedVersion] | @tsv' out/vulnerabilities.json
          fi
          exit "$scan_status"
      - name: Keep reports even when a vulnerability blocks the release
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-${{ matrix.arch }}
          path: out/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Transfer only successful, scanned images to the publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'm8-team/bitrix-operator'
    needs: [policy, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: images
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Recheck release eligibility after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 hack/release/policy.py
      - name: Publish and verify signed images, then prepare draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash hack/release/publish.sh
