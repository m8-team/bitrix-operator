name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: API server ${{ matrix.kubernetes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.36.0", "1.37.0"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Formatting, module integrity and unchanged API contract
        run: |
          test -z "$(gofmt -l api cmd internal test)"
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          cmp docs/reference/bitrixcluster_types.go.txt api/v1alpha1/bitrixcluster_types.go
      - name: Build and test on a real API server
        env:
          ENVTEST_K8S_VERSION: ${{ matrix.kubernetes }}
        run: |
          make build
          make test
      - name: Verify generated artifacts and installation manifests
        run: make verify-generated
