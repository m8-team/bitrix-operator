name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: API server ${{ matrix.kubernetes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.36.0", "1.37.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting, module integrity and unchanged API contract
        run: |
          diff="$(gofmt -d api cmd internal test)"
          if [ -n "$diff" ]; then
            printf '%s\n' "$diff"
            exit 1
          fi
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          cmp docs/reference/bitrixcluster_types.go.txt api/v1alpha1/bitrixcluster_types.go
      - name: Build and test on a real API server
        env:
          ENVTEST_K8S_VERSION: ${{ matrix.kubernetes }}
        run: |
          make build
          make test
      - name: Verify generated artifacts and installation manifests
        run: make verify-generated
