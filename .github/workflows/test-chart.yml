name: Install artifacts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kind:
    name: Kustomize and Helm lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Install pinned Helm and kind
        run: |
          bash hack/install-helm.sh
          curl -fsSLo /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind' | sha256sum -c -
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
      - name: Check chart and generated sources
        run: |
          make test-chart
          make build-installer IMG=controller:dev
          git diff --exit-code -- api config dist
      - name: Exercise installer, upgrade, rollback, uninstall and reinstall
        run: bash hack/e2e-chart.sh
