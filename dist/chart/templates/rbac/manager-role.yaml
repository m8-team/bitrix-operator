apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "bitrix-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
  {{- (fromYaml (.Files.Get "files/manager-role.yaml")).rules | toYaml | nindent 2 }}
