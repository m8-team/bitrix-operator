apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: BitrixCluster
    patch: |-
      apiVersion: bitrix.m8.team/v1alpha1
      kind: BitrixCluster
      metadata:
        name: example
      spec:
        database:
          engine: PostgreSQL
          connections:
            - name: default
              host: postgres.database.svc.cluster.local
              port: 5432
              database: bitrix
              username: bitrix
              passwordSecretRef:
                name: bitrix-database
                key: password
