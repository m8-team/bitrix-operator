apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: BitrixCluster
    patch: |-
      apiVersion: bitrix.m8.team/v1alpha1
      kind: BitrixCluster
      metadata:
        name: example
      spec:
        runtime:
          web:
            replicas: 2
            autoscaling:
              enabled: true
              minReplicas: 2
              maxReplicas: 6
              targetCPUUtilization: 70
            nginx:
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
            php:
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
