apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: BitrixCluster
    patch: |-
      apiVersion: bitrix.m8.team/v1alpha1
      kind: BitrixCluster
      metadata:
        name: example
      spec:
        runtime:
          web:
            replicas: 1
        storage:
          uploads:
            persistentVolumeClaim:
              storageClassName: standard
              accessModes: [ReadWriteOnce]
