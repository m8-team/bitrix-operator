apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bitrix-manager-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bitrix-operator
      control-plane: controller-manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {protocol: TCP, port: 8443}
