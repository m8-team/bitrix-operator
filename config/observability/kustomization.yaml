apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../default
  - monitor.yaml
  - alerts.yaml
  - metrics-reader-binding.yaml
patches:
  - target:
      kind: Deployment
      name: bitrix-operator-controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --metrics-cert-path=/run/metrics-tls
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: metrics-tls
          mountPath: /run/metrics-tls
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: metrics-tls
          secret:
            secretName: bitrix-operator-metrics-tls
