# Replace this subject with the actual Prometheus server ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bitrix-operator-prometheus-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bitrix-operator-metrics-reader
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
